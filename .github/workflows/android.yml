name: Build SkiaX APK

on:
  workflow_dispatch:
  push:
    branches: [ feature/xamarin, ux-fix ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          # runner 预装 .NET 10，会把 DOTNET_ROOT 指过去，导致 global.json 失效
          dotnet-quality: 'ga'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update

      - name: Show toolchain
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          which dotnet
          dotnet --version
          dotnet --info | head -20
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Guard SDK version
        run: |
          set -e
          V=$(dotnet --version)
          echo "SDK in use: $V"
          case "$V" in
            8.0.*) echo "OK: 使用 .NET 8 SDK" ;;
            *) echo "::error::期望 .NET 8 SDK，实际 $V（global.json 未生效）"; exit 1 ;;
          esac

      - name: Restore
        run: dotnet restore Emuera.Xamarin.Android/Emuera.Xamarin.Android.csproj

      # ---------- 1) 首选：只编 arm64-v8a ----------
      # csproj 里的 <RuntimeIdentifiers> 写死四架构，直接用 -p: 覆盖它会触发
      # MSB4018（Core 的 TargetPath 带上 rid 子目录，产物却落在无 rid 目录）。
      # 所以改成 csproj 支持 SkiaXSingleAbi 开关：设了就把列表换成单个 RID，
      # MSBuild 从头到尾只有这一个架构，路径自洽，不会再打架。
      # 编完仍用 check_apk_abi.py 验产物，防止再次静默出多架构包。
      - name: Build arm64 APK
        id: build_arm64
        continue-on-error: true
        run: |
          set -e
          dotnet publish Emuera.Xamarin.Android/Emuera.Xamarin.Android.csproj \
            -c Release -f net8.0-android \
            -r android-arm64 \
            -p:SkiaXSingleAbi=android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:RunAOTCompilation=false \
            -p:CheckEolWorkloads=false
          mkdir -p keep
          APK=$(find Emuera.Xamarin.Android/bin/Release -name '*.apk' \
                  ! -name '*-Signed.apk' | head -1)
          test -n "$APK" || { echo "::warning::没出 APK"; exit 1; }
          echo "取自：$APK"
          echo "==== 校验产物架构 ===="
          python3 scripts/check_apk_abi.py "$APK" arm64-v8a
          cp "$APK" keep/Emuera.SkiaX-arm64-v8a.apk
          ls -la keep/

      # ---------- 2) 兜底：单架构编不出来就直接出四合一，不裁剪 ----------
      # 只在上面失败时跑。合一包是早就验证过能用的路径，直接原样交付，
      # 省掉裁剪这一层（体积大些但一定能装）。
      - name: Fallback universal APK
        if: steps.build_arm64.outcome != 'success'
        run: |
          set -e
          # 上一次 -r 构建失败留下的 bin/obj 必须清掉，否则新旧产物会混
          rm -rf Emuera.Xamarin.Android/bin Emuera.Xamarin.Android/obj \
                 Emuera.Xamarin.Core/bin Emuera.Xamarin.Core/obj
          dotnet publish Emuera.Xamarin.Android/Emuera.Xamarin.Android.csproj \
            -c Release -f net8.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:RunAOTCompilation=false \
            -p:CheckEolWorkloads=false
          mkdir -p keep
          UNIV=$(find Emuera.Xamarin.Android/bin/Release -name '*.apk' \
                  ! -name '*-Signed.apk' | head -1)
          test -n "$UNIV" || { echo "::error::未找到合一包 APK"; exit 1; }
          echo "取自：$UNIV"
          cp "$UNIV" keep/Emuera.SkiaX-universal.apk
          ls -la keep/

      - name: Sign APK
        run: |
          set -e
          mkdir -p out
          # 两个包里挑一个：优先 arm64 单架构，否则用合一包
          if [ -f keep/Emuera.SkiaX-arm64-v8a.apk ]; then
            SRC=keep/Emuera.SkiaX-arm64-v8a.apk
            NAME=Emuera.SkiaX-arm64-v8a
          elif [ -f keep/Emuera.SkiaX-universal.apk ]; then
            SRC=keep/Emuera.SkiaX-universal.apk
            NAME=Emuera.SkiaX-universal
            echo "::notice::单架构构建未成功，本次产出四合一包"
          else
            echo "::error::keep/ 里没有任何 APK 可签名"
            exit 1
          fi
          echo "签哪个：$SRC"

          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore out/dev.keystore -storepass "$PASS" -keypass "$PASS" \
            -alias skiax -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SkiaX CI, OU=Community Build, O=SkiaX, L=-, S=-, C=-"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)

          DST="out/$NAME-signed.apk"
          # zipalign 保证 resources.arsc 4 字节、未压缩 .so 4K 页对齐。
          # 两种来源本来就对齐，过一遍是保险。
          "$BT/zipalign" -f -p 4 "$SRC" "$DST.aligned"
          "$BT/apksigner" sign --ks out/dev.keystore --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" --ks-key-alias skiax \
            --out "$DST" "$DST.aligned"
          rm -f "$DST.aligned" out/dev.keystore

          echo "==== 最终产物 ===="
          ls -la out/
          "$BT/apksigner" verify --print-certs "$DST" | head -5
          echo "APK_SIZE=$(stat -c %s "$DST")" >> "$GITHUB_ENV"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "### SkiaX 构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| arm64 单架构编译 | ${{ steps.build_arm64.outcome }} |"
            echo "| 产物 | \`${APK_NAME:-未知}\` |"
            echo "| 体积 | ${APK_SIZE:-?} 字节 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: skiax-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
