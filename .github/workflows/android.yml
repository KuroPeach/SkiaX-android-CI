name: Build SkiaX APK

on:
  workflow_dispatch:
  push:
    branches: [ feature/xamarin, ux-fix ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          # runner 预装 .NET 10，会把 DOTNET_ROOT 指过去，导致 global.json 失效
          dotnet-quality: 'ga'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update

      - name: Show toolchain
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          which dotnet
          dotnet --version
          dotnet --info | head -20
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Guard SDK version
        run: |
          set -e
          V=$(dotnet --version)
          echo "SDK in use: $V"
          case "$V" in
            8.0.*) echo "OK: 使用 .NET 8 SDK" ;;
            *) echo "::error::期望 .NET 8 SDK，实际 $V（global.json 未生效）"; exit 1 ;;
          esac

      - name: Restore
        run: dotnet restore Emuera.Xamarin.Android/Emuera.Xamarin.Android.csproj

      # ---------- 1) 全 ABI 合一包（兼容所有设备，体积大）----------
      - name: Build universal APK
        run: |
          dotnet publish Emuera.Xamarin.Android/Emuera.Xamarin.Android.csproj \
            -c Release -f net8.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:RunAOTCompilation=false \
            -p:CheckEolWorkloads=false

      # 合一包先另存，后面分架构构建会清空 bin/obj
      - name: Keep universal APK
        run: |
          set -e
          mkdir -p keep
          UNIV=$(find Emuera.Xamarin.Android/bin/Release/net8.0-android -maxdepth 1 -name '*.apk' ! -name '*-Signed.apk' | head -1)
          if [ -z "$UNIV" ]; then
            UNIV=$(find Emuera.Xamarin.Android/bin/Release/net8.0-android -maxdepth 1 -name '*.apk' | head -1)
          fi
          test -n "$UNIV" || { echo "::error::未找到合一包 APK"; exit 1; }
          cp "$UNIV" keep/Emuera.SkiaX-universal.apk
          ls -la keep/

      # ---------- 2) 按 ABI 拆分的独立包（每个体积小很多）----------
      # RuntimeIdentifiers 只留一个 RID，即可只打该架构的运行时与程序集
      - name: Build per-ABI APKs
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            case "$ABI" in
              arm64-v8a)   RID=android-arm64 ;;
              armeabi-v7a) RID=android-arm   ;;
              x86)         RID=android-x86   ;;
              x86_64)      RID=android-x64   ;;
            esac
            echo "==== 构建 $ABI ($RID) ===="
            # 每次换 RID 前必须清掉中间产物：多 RID 的 obj/ 残留会让
            # GetAssemblyAttributes 找不到目标 RID 下的 dll（MSB4018）
            rm -rf Emuera.Xamarin.Android/obj Emuera.Xamarin.Android/bin \
                   Emuera.Xamarin.Core/obj Emuera.Xamarin.Core/bin
            dotnet publish Emuera.Xamarin.Android/Emuera.Xamarin.Android.csproj \
              -c Release -f net8.0-android \
              -p:AndroidPackageFormat=apk \
              -p:AndroidKeyStore=false \
              -p:RunAOTCompilation=false \
              -p:CheckEolWorkloads=false \
              -p:RuntimeIdentifiers="$RID" \
              -o "perabi/$ABI"
            find "perabi/$ABI" -maxdepth 2 -name '*.apk' -exec ls -la {} \;
          done

      - name: Sign all APKs
        run: |
          set -e
          mkdir -p out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore out/dev.keystore -storepass "$PASS" -keypass "$PASS" \
            -alias skiax -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SkiaX CI, OU=Community Build, O=SkiaX, L=-, S=-, C=-"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)

          sign() {
            local src="$1" dst="$2"
            "$BT/apksigner" sign --ks out/dev.keystore --ks-pass "pass:$PASS" \
              --key-pass "pass:$PASS" --ks-key-alias skiax \
              --out "$dst" "$src"
            echo "signed: $dst ($(du -h "$dst" | cut -f1))"
          }

          # 合一包（前面已另存到 keep/）
          test -f keep/Emuera.SkiaX-universal.apk || { echo "::error::合一包未保存"; exit 1; }
          sign keep/Emuera.SkiaX-universal.apk out/Emuera.SkiaX-universal-signed.apk

          # 分架构包
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            APK=$(find "perabi/$ABI" -maxdepth 2 -name '*.apk' ! -name '*-Signed.apk' | head -1)
            if [ -z "$APK" ]; then
              APK=$(find "perabi/$ABI" -maxdepth 2 -name '*.apk' | head -1)
            fi
            if [ -z "$APK" ]; then
              echo "::warning::$ABI 未产出 APK，跳过"
              continue
            fi
            sign "$APK" "out/Emuera.SkiaX-$ABI-signed.apk"
          done

          rm -f out/dev.keystore
          echo "==== 最终产物 ===="
          ls -la out/

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: skiax-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
